<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%

		<link rel="preload" as="image" href="/wp/win7-1.jpg">
		<link rel="preload" as="image" href="/wp/win7-2.jpg">
		<link rel="preload" as="image" href="/wp/win7-3.jpg">
		<link rel="preload" as="image" href="/wp/win7-4.jpg">
		<link rel="preload" as="image" href="/wp/win7-5.jpg">
		<link rel="preload" as="image" href="/wp/win7-6.jpg">

		<script>
			// preload bg image before SvelteKit loads
			const wp_count = 6;
			const now = new Date();
			const index = Math.floor(now.getMinutes()) % wp_count;
			const bgUrl = `/wp/win7-${index + 1}.jpg`;
			const img = new Image();
			img.src = bgUrl;
			img.decode?.().then(() => {
				document.body.style.background = `url('${bgUrl}') center/cover no-repeat fixed`;
				document.body.style.zIndex = '0';
			});
		</script>

		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    	<link href="/7.css" rel="stylesheet">
		<link href="/styles.css" rel="stylesheet">
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
