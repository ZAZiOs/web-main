<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<title>ZAZiOs.ru</title>
		<meta name="description" content="Сайт про ZAZiOs в стиле Windows 7. Здесь вы найдете информацию обо мне, моих проектах и как со мной связаться. Кстати, на компах можно двигать окошки!">
		<meta name="keywords" content="ZAZiOs, визитка, Windows 7, портфолио, персональный сайт">
		<meta name="author" content="ZAZiOs">
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta property="og:title" content="ZAZiOs.ru">
		<meta property="og:description" content="Сайт про ZAZiOs в стиле Windows 7.">
		<meta property="og:image" content="https://zazios.ru/preview.jpg">
		<meta property="og:url" content="https://zazios.ru">
		<meta property="og:type" content="website">
		<meta property="og:site_name" content="ZAZiOs.ru">

		<meta name="twitter:card" content="summary_large_image">
		<meta name="twitter:title" content="ZAZiOs.ru">
		<meta name="twitter:description" content="Сайт про ZAZiOs в стиле Windows 7.">
		<meta name="twitter:image" content="https://zazios.ru/preview.jpg">
		<meta name="twitter:url" content="https://zazios.ru">
		
		%sveltekit.head%

		<link rel="preload" as="image" href="/wp/win7-1.jpg">
		<link rel="preload" as="image" href="/wp/win7-2.jpg">
		<link rel="preload" as="image" href="/wp/win7-3.jpg">
		<link rel="preload" as="image" href="/wp/win7-4.jpg">
		<link rel="preload" as="image" href="/wp/win7-5.jpg">
		<link rel="preload" as="image" href="/wp/win7-6.jpg">

		<script>
			// preload bg image before SvelteKit loads
			if (window.location.pathname !== '/projects') {
				const wp_count = 6;
				const now = new Date();
				const index = Math.floor(now.getMinutes()) % wp_count;
				const bgUrl = `/wp/win7-${index + 1}.jpg`;

				const img = new Image();
				img.src = bgUrl;
				img.decode?.().then(() => {
					document.body.style.background = `url('${bgUrl}') center/cover no-repeat fixed`;
					document.body.style.zIndex = '0';
				});
			}
		</script>

		<link href="/bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
    	<link href="/7.css" rel="stylesheet">
		<link href="/styles.css" rel="stylesheet">

	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
